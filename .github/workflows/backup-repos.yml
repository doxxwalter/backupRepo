name: Backup All Repos to Google Drive

on:
  schedule:
    - cron: "0 0 * * 0"  # Every Sunday midnight
  workflow_dispatch:      # Manual trigger too
  workflow_call:          # Called by sync-forks.yml

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_TOKEN: ${{ secrets.RCLONE_CONFIG_GDRIVE_TOKEN }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << RCLONE
          [gdrive]
          type = drive
          scope = drive
          root_folder_id = ${FOLDER_ID}
          token = ${RCLONE_TOKEN}
          RCLONE
          echo "rclone config written"
          rclone listremotes

      - name: Clone and upload all repos
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          # Date folder for this run
          DATE=$(date +%Y-%m-%d)
          DRIVE_PATH="gdrive:/$DATE"
          echo "Uploading to Drive folder: $DATE"

          # Fetch already uploaded zips in today's folder (resume support)
          UPLOADED=$(rclone lsf "$DRIVE_PATH" --drive-root-folder-id "$FOLDER_ID" 2>/dev/null || echo "")
          echo "Already uploaded today: $UPLOADED"

          REPOS=""

          # Your own repos
          PAGE=1
          while true; do
            BATCH=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/user/repos?type=all&per_page=100&page=$PAGE" \
              | jq -r '.[].full_name')
            [ -z "$BATCH" ] && break
            REPOS="$REPOS $BATCH"
            PAGE=$((PAGE + 1))
          done

          # Orgs from backup.config
          ORGS=$(awk '/^\[orgs\]/{f=1;next} /^\[/{f=0} f && /^[^#]/{print $1}' backup.config)
          for ORG in $ORGS; do
            echo "Fetching repos for org: $ORG"
            PAGE=1
            while true; do
              BATCH=$(curl -s -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/orgs/$ORG/repos?type=all&per_page=100&page=$PAGE" \
                | jq -r '.[].full_name')
              [ -z "$BATCH" ] && break
              REPOS="$REPOS $BATCH"
              PAGE=$((PAGE + 1))
            done
          done

          # Users from backup.config
          USERS=$(awk '/^\[users\]/{f=1;next} /^\[/{f=0} f && /^[^#]/{print $1}' backup.config)
          for USER in $USERS; do
            echo "Fetching repos for user: $USER"
            PAGE=1
            while true; do
              BATCH=$(curl -s -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/users/$USER/repos?type=public&per_page=100&page=$PAGE" \
                | jq -r '.[].full_name')
              [ -z "$BATCH" ] && break
              REPOS="$REPOS $BATCH"
              PAGE=$((PAGE + 1))
            done
          done

          echo "Found repos: $REPOS"

          for REPO in $REPOS; do
            NAME=$(echo $REPO | tr '/' '_')
            ZIPNAME="$NAME.zip"

            # Skip if already uploaded today (resume support)
            if echo "$UPLOADED" | grep -qx "$ZIPNAME"; then
              echo "⏭ Skipping $REPO (already uploaded today)"
              continue
            fi

            echo "⬇ Cloning $REPO..."
            if ! GIT_LFS_SKIP_SMUDGE=1 git clone --depth=1 "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" "$NAME"; then
              echo "⚠ Skipping $REPO (clone failed — disabled, private, or inaccessible)"
              continue
            fi

            zip -r "$ZIPNAME" "$NAME"
            rclone copy "$ZIPNAME" "$DRIVE_PATH" \
              --drive-root-folder-id "$FOLDER_ID" \
              --drive-upload-cutoff 1000G \
              --drive-chunk-size 256M \
              --progress
            rm -rf "$NAME" "$ZIPNAME"
            echo "✓ $REPO uploaded to $DATE/"
          done

          echo "All done!"
